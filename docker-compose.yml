services:
  postgres:
    build: ./db
    environment:
      POSTGRES_USER: volleyball
      POSTGRES_PASSWORD: volleyball
      POSTGRES_DB: volleyball
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volleyball -d volleyball"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    # MinIO's Docker Hub image is gone. RustFS speaks the same S3 API.
    image: rustfs/rustfs:latest
    command: server /data
    ports:
      - "9000:9000"
    environment:
      RUSTFS_ACCESS_KEY: minio
      RUSTFS_SECRET_KEY: minio-secret-key
      RUSTFS_REGION: us-east-1
      RUSTFS_VOLUMES: /data
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null --connect-timeout 2 http://127.0.0.1:9000/"]
      interval: 2s
      timeout: 5s
      retries: 30

  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgres://volleyball:volleyball@postgres:5432/volleyball
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: videos
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio-secret-key
      S3_REGION: us-east-1
      WEB_ORIGIN: http://localhost:3010,http://127.0.0.1:3010
      WORK_DIR: /work
      MAX_UPLOAD_BYTES: "8589934592"
      MAX_DURATION_SECONDS: "9000"
      FFMPEG_THREADS: "0"
      PROXY_FPS: "5"
      PROXY_HEIGHT: "320"
      BALL_IMGSZ: "320"
      BALL_THREADS: "0"
      BALL_DEVICE: "auto"
      ANALYZE_TIMEOUT_SECONDS: "3600"
      EXPORT_TIMEOUT_SECONDS: "10800"
      RETENTION_HOURS: "24"
    volumes:
      - worker_scratch:/work
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys; sys.exit(0 if pathlib.Path('/tmp/ready').exists() else 1)"]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    build: ./web
    ports:
      - "3010:3000"
    environment:
      DATABASE_URL: postgres://volleyball:volleyball@postgres:5432/volleyball
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: videos
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio-secret-key
      S3_REGION: us-east-1
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      MAX_UPLOAD_BYTES: "8589934592"
      STORAGE_CAP_BYTES: "10737418240"
      JOBS_PER_IP_PER_HOUR: "3"
      PRESIGNS_PER_IP_PER_10_MIN: "30"
      SEGMENT_WRITES_PER_MINUTE: "60"
      EXPORTS_PER_JOB_PER_HOUR: "2"
      PLAYBACK_URL_SECONDS: "900"
      DOWNLOAD_URL_SECONDS: "3600"
      MAX_DURATION_SECONDS: "9000"
      RETENTION_HOURS: "24"
      PART_SIZE: "67108864"
      MAX_SEGMENT_BODY_BYTES: "262144"
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  worker_scratch:
